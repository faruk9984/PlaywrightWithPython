name: Test Application

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Remove conflicting plugins
        run: |
          pip uninstall -y html-reporter pytest-html-reporter pytest_html_reporter 2>/dev/null || true

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Run pytest with verbose output
        run: |
          pytest -v --tb=short

      - name: Generate test report summary
        if: always()
        run: |
          echo "## Test Report" >> $GITHUB_STEP_SUMMARY
          echo "Python Version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "Test Status: $(if [ $? -eq 0 ]; then echo 'PASSED'; else echo 'FAILED'; fi)" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pytest-html-report-py${{ matrix.python-version }}
          path: reports/report.html
          retention-days: 30
        continue-on-error: true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-py${{ matrix.python-version }}
          path: logs/
          retention-days: 30
        continue-on-error: true

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint 2>/dev/null || true

      - name: Run flake8 linter
        run: |
          flake8 tests_ui_layout/ pom/ --count --select=E9,F63,F7,F82 --show-source --statistics 2>/dev/null || true

      - name: Check pytest.ini syntax
        run: |
          python -m py_compile pytest.ini 2>&1 || echo "Note: pytest.ini is config, not Python code"

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Test Results
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed successfully!"
          else
            echo "❌ Tests failed. Check logs for details."
          fi

