[pytest]
markers =
    integration: marks integration tests
    regression: marks regression tests
    smoke: marks smoke tests
    smoke2: marks smoke tests 2
    unitT2: marks unitT2 tests

;addopts = -v --html=reports/report.html --self-contained-html --template=html1/index.html --report=htmlreport/report.html
# Disable incompatible html reporter plugin used in some CI images that causes
# AttributeError during teardown. The `-p no:...` flag prevents the plugin
# from loading. Keep pytest-html enabled (if installed) to generate reports.
addopts = -v -p no:pytest_html_reporter --html=reports/report.html --self-contained-html
