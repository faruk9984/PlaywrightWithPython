[pytest]
markers =
    integration: marks integration tests
    regression: marks regression tests
    smoke: marks smoke tests
    smoke2: marks smoke tests 2
    unitT2: marks unitT2 tests

;addopts = -v --html=reports/report.html --self-contained-html --template=html1/index.html --report=htmlreport/report.html
# Disable incompatible html-reporter plugin (0.2.9+) that causes AttributeError
# during teardown due to missing _sessionstarttime attr in newer pytest versions.
# Using correct plugin name: html_reporter (pytest normalizes hyphens to underscores).
# Keep pytest-html enabled (if installed) to generate reports.
addopts = -v -p no:html_reporter --html=reports/report.html --self-contained-html
